name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Started by sync.yml on its sync/<date> pull request: PRs made with the
  # workflow token don't trigger pull_request runs, but a dispatched run's
  # checks attach to the branch's commit.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Optional code signing (docs/SIGNING.md). Without these the build is
      # unsigned; everything else works the same. SignPath signs tagged
      # builds; a .pfx (SIGN_PFX_*) signs every build.
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
      SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && startsWith(github.ref, 'refs/tags/v') }}
      # The Store Edition's release key (tools/release ci-secret): with it,
      # CI signs and publishes tagged releases itself.
      HAS_RELEASE_KEY: ${{ secrets.SEAGLASS_RELEASE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x' # latest patch: releases ship Go's security fixes
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        # Pinned: v3 is in beta and moves fast; upgrades are deliberate.
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26

      - name: Install NSIS
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          # Newer runner images don't have it; Chocolatey's feed sometimes answers 503.
          for ($i = 0; $i -lt 4 -and -not (Test-Path "$nsis\makensis.exe"); $i++) {
            if ($i) { Start-Sleep -Seconds 30 }
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path "$nsis\makensis.exe")) { throw 'NSIS could not be installed' }
          "MAKENSIS=$nsis\makensis.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Version
        # Release builds carry their tag (shown in the app and in the exe's
        # file properties); everything else is "dev". Tags below v1 or with a
        # suffix (v1.1.0-beta.1) are published as previews, which the
        # updater skips. The Store Edition's own numbers (v1.9.0-store.2)
        # are full releases.
        run: |
          $v = 'dev'; $num = '0.0.0'; $pre = 'false'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME
            $num = ($v.TrimStart('v') -split '[-+]')[0]
            if (($v -match '-' -and $v -notmatch '^v[\d.]+-store\.\d+$') -or $v -like 'v0.*') { $pre = 'true' }
            $j = Get-Content build/windows/info.json -Raw | ConvertFrom-Json
            $j.fixed.file_version = $num
            $j.info.'0409'.ProductVersion = $num
            $j | ConvertTo-Json -Depth 10 | Set-Content build/windows/info.json -Encoding utf8
          }
          "WL_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WL_NUM=$num" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WL_PRERELEASE=$pre" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: wails3 build VERSION=${{ env.WL_VERSION }}

      - name: Test
        run: go test ./...

      - name: Test with the race detector
        # Needs cgo; the runner's MinGW gcc provides it.
        env:
          CGO_ENABLED: '1'
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) { go test -race ./internal/... }
          else { Write-Host 'gcc not found: skipping the race detector' }

      - name: Check frontend
        working-directory: frontend
        run: npm run check

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Sign
        if: env.SIGNPATH != 'true'
        run: ./build/windows/sign.ps1 bin/Seaglass.exe

      - name: WebView2 bootstrapper
        run: wails3 generate webview2bootstrapper -dir build/windows/nsis

      # SignPath signs remotely, so the uninstaller is built on its own first
      # (NSIS can't call out to a remote signer mid-build) and signed with
      # the exe; the installer then packs both and is signed in a second round.
      - name: Uninstaller for SignPath
        if: env.SIGNPATH == 'true'
        run: |
          & $env:MAKENSIS -V2 "-DARG_WAILS_AMD64_BINARY=$pwd\bin\Seaglass.exe" "-DINFO_PRODUCTVERSION=$env:WL_NUM" -DINNER build/windows/nsis/project.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Process bin/uninstaller-maker.exe -Wait
          if (-not (Test-Path bin/uninstall.exe)) { throw 'the uninstaller was not written' }
          New-Item -ItemType Directory -Force unsigned | Out-Null
          Copy-Item bin/Seaglass.exe, bin/uninstall.exe unsigned/

      - name: Upload binaries for signing
        id: unsigned-binaries
        if: env.SIGNPATH == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-binaries
          path: unsigned/*

      - name: Sign binaries (SignPath)
        if: env.SIGNPATH == 'true'
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-binaries

      - name: Installer
        run: |
          $defs = @("-DARG_WAILS_AMD64_BINARY=$pwd\bin\Seaglass.exe", "-DINFO_PRODUCTVERSION=$env:WL_NUM")
          if ($env:SIGNPATH -eq 'true') {
            Copy-Item signed-binaries/Seaglass.exe, signed-binaries/uninstall.exe bin/ -Force
            $defs += "-DSIGNED_UNINSTALLER=$pwd\bin\uninstall.exe"
          } elseif ($env:SIGN_PFX_BASE64) {
            $defs += "-DSIGN_CMD=powershell -NoProfile -ExecutionPolicy Bypass -File $pwd\build\windows\sign.ps1"
          }
          & $env:MAKENSIS -V2 @defs build/windows/nsis/project.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:SIGNPATH -ne 'true') { ./build/windows/sign.ps1 bin/Seaglass-setup.exe }

      - name: Upload installer for signing
        id: unsigned-installer
        if: env.SIGNPATH == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-installer
          path: bin/Seaglass-setup.exe

      - name: Sign installer (SignPath)
        if: env.SIGNPATH == 'true'
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Use the signed installer
        if: env.SIGNPATH == 'true'
        run: Copy-Item signed-installer/Seaglass-setup.exe bin/ -Force

      - name: Installer smoke test
        # Install silently, start in the tray, close it the way the installer
        # does (--quit), uninstall silently: what an update and an uninstall do.
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Seaglass test'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Seaglass'
          Start-Process bin/Seaglass-setup.exe -ArgumentList "/S /D=$dir" -Wait
          if (-not (Test-Path "$dir\Seaglass.exe") -or -not (Test-Path "$dir\uninstall.exe")) { throw 'files missing after install' }
          $ver = (Get-ItemProperty $key).DisplayVersion
          if ($ver -ne $env:WL_NUM) { throw "uninstall entry says $ver, expected $env:WL_NUM" }
          $q = Start-Process "$dir\Seaglass.exe" -ArgumentList '--quit' -PassThru
          if (-not $q.WaitForExit(15000)) { throw '--quit with nothing running did not exit' }
          $p = Start-Process "$dir\Seaglass.exe" -ArgumentList '--tray' -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "Seaglass exited on its own (code $($p.ExitCode))" }
          $q = Start-Process "$dir\Seaglass.exe" -ArgumentList '--quit' -PassThru
          if (-not $q.WaitForExit(15000)) { throw '--quit did not return' }
          if (-not $p.WaitForExit(20000)) { throw 'Seaglass did not quit when asked' }
          Start-Process "$dir\uninstall.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\Seaglass.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\Seaglass.exe") { throw 'files left after uninstall' }
          if (Test-Path $key) { throw 'uninstall entry left' }
          Get-Content "$env:APPDATA\Seaglass\seaglass.log" -ErrorAction SilentlyContinue | Select-Object -Last 10
          $crash = "$env:APPDATA\Seaglass\crash.log"
          if ((Test-Path $crash) -and (Get-Item $crash).Length -gt 0) { Get-Content $crash; throw 'Seaglass crashed' }

      - name: Update from WaterLauncher
        # Installing Seaglass over WaterLauncher 1.4 (here given its folder,
        # /D=...\WaterLauncher): Seaglass must end up in its own folder, take
        # over the library and "start with Windows", and leave nothing of
        # WaterLauncher behind.
        run: |
          $old = "$env:LOCALAPPDATA\Programs\WaterLauncher"
          $new = "$env:LOCALAPPDATA\Programs\Seaglass"
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          Remove-Item "$env:APPDATA\Seaglass", "$env:LOCALAPPDATA\Seaglass" -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest https://github.com/ApolloF/WaterLauncher/releases/download/v1.4.0/WaterLauncher-setup.exe -OutFile "$env:RUNNER_TEMP\wl-setup.exe"
          Start-Process "$env:RUNNER_TEMP\wl-setup.exe" -ArgumentList '/S' -Wait
          if (-not (Test-Path "$old\WaterLauncher.exe")) { throw 'WaterLauncher 1.4 did not install' }
          New-Item -ItemType Directory "$env:APPDATA\WaterLauncher" -Force | Out-Null
          '{"games":[]}' | Out-File "$env:APPDATA\WaterLauncher\library.json" -Encoding ascii
          if (-not (Test-Path $run)) { New-Item $run -Force | Out-Null } # missing on some runners
          Set-ItemProperty $run -Name WaterLauncher -Value "`"$old\WaterLauncher.exe`" --tray"
          $i = Start-Process bin/Seaglass-setup.exe -ArgumentList "/S /relaunch /tray /D=$old" -PassThru
          $i.WaitForExit()
          for ($t = 0; $t -lt 30 -and -not (Test-Path "$env:APPDATA\Seaglass\library.json"); $t++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path "$new\Seaglass.exe")) { throw 'Seaglass not in its own folder' }
          if (Test-Path $old) { throw 'WaterLauncher folder left' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\WaterLauncher') { throw 'WaterLauncher uninstall entry left' }
          if ((Test-Path "$env:APPDATA\WaterLauncher") -or -not (Test-Path "$env:APPDATA\Seaglass\library.json")) { throw 'library not moved' }
          Start-Sleep -Seconds 3
          $r = Get-ItemProperty $run
          if ($r.WaterLauncher -or -not $r.Seaglass) { throw "start with Windows not moved: $($r.Seaglass)" }
          $q = Start-Process "$new\Seaglass.exe" -ArgumentList '--quit' -PassThru
          if (-not $q.WaitForExit(15000)) { throw '--quit did not return' }
          Start-Process "$new\uninstall.exe" -ArgumentList '/S' -Wait
          Get-Content "$env:APPDATA\Seaglass\seaglass.log" -ErrorAction SilentlyContinue | Select-Object -Last 10

      - name: Checksums
        run: |
          foreach ($f in 'Seaglass.exe', 'Seaglass-setup.exe') {
            $h = (Get-FileHash "bin/$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f" | Out-File "bin/$f.sha256" -Encoding ascii
          }

      - uses: actions/upload-artifact@v6
        with:
          name: Seaglass
          path: |
            bin/Seaglass.exe
            bin/Seaglass.exe.sha256
            bin/Seaglass-setup.exe
            bin/Seaglass-setup.exe.sha256

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $notes = "docs/releases/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path $notes)) { "Release $env:GITHUB_REF_NAME" | Out-File $notes -Encoding utf8 }
          "WL_NOTES=$notes" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Seaglass Store Edition ${{ github.ref_name }}
          prerelease: ${{ env.WL_PRERELEASE == 'true' }}
          # A draft until signed (next step, or go run ./tools/release
          # publish <tag>). Drafts are invisible to the updater.
          draft: true
          body_path: ${{ env.WL_NOTES }}
          generate_release_notes: true
          files: |
            bin/Seaglass-setup.exe
            bin/Seaglass-setup.exe.sha256
            bin/Seaglass.exe
            bin/Seaglass.exe.sha256

      - name: Sign and publish
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASE_KEY == 'true'
        env:
          SEAGLASS_RELEASE_KEY: ${{ secrets.SEAGLASS_RELEASE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: go run ./tools/release publish $env:GITHUB_REF_NAME

  feed:
    # The signed release, copied to the public releases-only repository
    # installed copies update from (feed.yml). Off until the maintainer sets
    # the PUBLISH_UPDATE_FEED variable and the SEAGLASS_FEED_TOKEN secret.
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_UPDATE_FEED == 'true'
    uses: ./.github/workflows/feed.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
