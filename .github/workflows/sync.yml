name: sync with Seaglass

# Brings Seaglass's own work into the Store Edition every Monday (and on
# demand): Seaglass's main is merged into this main and the tests run. A
# clean, passing merge goes up as a sync/<date> pull request; CI is started on
# it with workflow_dispatch (a pull request made with the workflow token does
# not start pull_request runs), and the merge job merges it once that build
# passes. That works without auto-merge, which a private repository on the
# free plan doesn't have. A merge with conflicts, or one whose tests fail,
# becomes a pull request to finish by hand.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency: sync

jobs:
  sync:
    runs-on: windows-latest
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
      url: ${{ steps.pr.outputs.url }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pushes go over SSH with a write deploy key for this repository only:
          # the workflow token may not push commits that change workflow files,
          # and Seaglass's own commits sometimes do. main stays protected by the
          # ruleset (no bypass) and v* tags by the tag ruleset.
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Fetch Seaglass
        id: fetch
        run: |
          git remote add seaglass https://github.com/ApolloF/Seaglass.git
          git fetch seaglass main
          echo "sha=$(git rev-parse --short seaglass/main)" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor seaglass/main HEAD; then
            echo "Already has everything from Seaglass main."
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge
        id: merge
        if: steps.fetch.outputs.behind == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge --no-edit -m "Merge Seaglass main (${{ steps.fetch.outputs.sha }})" seaglass/main; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U
            git merge --abort
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.merge.outputs.clean == 'true'
        with:
          go-version: '1.27.x'
          check-latest: true

      - uses: actions/setup-node@v4
        if: steps.merge.outputs.clean == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate bindings
        # Seaglass's services and the store's meet in the generated bindings.
        if: steps.merge.outputs.clean == 'true'
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
          wails3 generate bindings -f '-tags production' -clean=true -ts -i
          if [ -n "$(git status --porcelain frontend/bindings)" ]; then
            git add frontend/bindings
            git commit -m "Regenerate bindings after merging Seaglass main"
          fi

      - name: Regenerate third-party notices
        # The Store has more dependencies than Seaglass, so the notices file that
        # comes with the merge is always out of date (build.yml checks it).
        if: steps.merge.outputs.clean == 'true'
        run: |
          (cd frontend && npm ci)
          go run ./tools/notices
          if [ -n "$(git status --porcelain THIRD_PARTY_NOTICES.txt)" ]; then
            git add THIRD_PARTY_NOTICES.txt
            git commit -m "Regenerate third-party notices after merging Seaglass main"
          fi

      - name: Test
        id: test
        if: steps.merge.outputs.clean == 'true'
        continue-on-error: true
        run: |
          set -e
          (cd frontend && npm ci && npm run build && npm run check && npm test)
          go vet ./...
          go test ./...

      - name: Pull request for the clean merge
        id: pr
        if: steps.merge.outputs.clean == 'true' && steps.test.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="sync/$(date -u +%F)"
          # A second run on the same day must not collide with the first branch.
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            branch="$branch-${{ steps.fetch.outputs.sha }}"
          fi
          git push origin "HEAD:refs/heads/$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "Merge Seaglass main (${{ steps.fetch.outputs.sha }})" \
            --body "Seaglass's main merged into the Store Edition; the tests passed. CI is started on this branch by the sync run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          gh workflow run build.yml --ref "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Pull request for a hand merge
        if: steps.fetch.outputs.behind == 'true' && (steps.merge.outputs.clean != 'true' || steps.test.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="sync/seaglass-${{ steps.fetch.outputs.sha }}"
          if [ "${{ steps.merge.outputs.clean }}" = "true" ]; then
            why="It merges cleanly, but the tests fail: see the sync run."
            git push origin "HEAD:refs/heads/$branch" --force
          else
            why="It doesn't merge cleanly: resolve the conflicts on this branch (git merge origin/main), then merge."
            git push origin "seaglass/main:refs/heads/$branch" --force
          fi
          if [ -z "$(gh pr list --head "$branch" --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "Merge Seaglass main (${{ steps.fetch.outputs.sha }})" \
              --body "Seaglass's main has changes the Store Edition doesn't have yet. $why Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

  merge:
    # Waits for the build on the sync pull request, then merges it. On Linux,
    # because waiting on a Windows runner costs double minutes once private.
    needs: sync
    if: needs.sync.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ needs.sync.outputs.branch }}
      URL: ${{ needs.sync.outputs.url }}
    steps:
      - name: Wait for the build, then merge
        run: |
          run=""
          for i in $(seq 1 30); do
            run=$(gh run list --workflow build.yml --branch "$BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            gh pr comment "$URL" --body "No build started on $BRANCH, so this sync wasn't merged. Run *build* on the branch, then merge by hand (merge commit)."
            exit 1
          fi
          if ! gh run watch "$run" --exit-status --interval 30 > /dev/null; then
            gh pr comment "$URL" --body "The build failed, so this sync wasn't merged: ${{ github.server_url }}/$GH_REPO/actions/runs/$run"
            exit 1
          fi
          # A merge commit, not a squash: Seaglass's history must stay an ancestor of main, or the next sync would repeat this one.
          if ! gh pr merge "$URL" --merge; then
            gh pr comment "$URL" --body "The build passed, but the workflow token couldn't merge this. That happens when Seaglass changed a workflow file. Merge it by hand with a merge commit."
            exit 1
          fi
